name: Remove temporary proof section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-proof:
    if: contains(github.event.head_commit.message, 'Add temporary proof-section removal workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unverified proof section and dead anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the entire proof/case-study section until verified examples are ready.
          pattern = r'\n<section id="work" class="editorial-bg editorial-bg-type">.*?</section>\n'
          s, count = re.subn(pattern, '\n', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected to remove one #work section, removed {count}')

          # Remove the now-dead Work navigation item.
          s = s.replace('<a href="#work">Work</a>', '', 1)

          # Keep CTAs useful without pointing to a removed section.
          s = s.replace('<a class="cta dark" href="#work">See what we can build</a>', '<a class="cta dark" href="#services">Explore services</a>', 1)
          s = s.replace('<a class="cta dark" href="#work">See apps & systems →</a>', '<a class="cta dark" href="#pick">See apps & systems →</a>', 1)

          if 'Proof, not promises' in s or 'Different problems.' in s or 'id="work"' in s:
              raise SystemExit('Proof section text or anchor still present')
          if 'href="#work"' in s:
              raise SystemExit('A dead #work link remains')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cleanup and remove this temporary workflow
        run: |
          git config user.name 'hellojoesolutions'
          git config user.email 'joe@hellojoe.solutions'
          git rm .github/workflows/remove-proof-section.yml
          git add index.html
          git commit -m 'Hide proof section until verified examples are ready'
          git push
