name: One-time platform rotator repair

on:
  push:
    paths:
      - '.github/workflows/fix-platform-rotator.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force single platform title and bust cached polish CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_link = '<link rel="stylesheet" href="assets/production-polish.css">'
          new_link = '<link rel="stylesheet" href="assets/production-polish.css?v=20260915-3">'
          if old_link in s:
              s = s.replace(old_link, new_link, 1)
          elif 'assets/production-polish.css?v=20260915-3' not in s:
              raise SystemExit('Could not find production polish stylesheet link')

          old_js = '''/* Where people look */
const lookWords=[...document.querySelectorAll('.hj-look-word')];
let lookIndex=0;
function cycleLookWords(){
  if(lookWords.length<2)return;
  const current=lookWords[lookIndex];
  const nextIndex=(lookIndex+1)%lookWords.length;
  const next=lookWords[nextIndex];
  current.classList.remove('is-active');current.classList.add('is-out');
  next.classList.remove('is-out','is-active');
  requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.add('is-active')));
  setTimeout(()=>current.classList.remove('is-out'),760);
  lookIndex=nextIndex;
}
if(lookWords.length){
  lookWords.forEach((word,index)=>word.classList.toggle('is-active',index===0));
  setInterval(cycleLookWords,1650);
}'''

          new_js = '''/* Where people look — exactly one platform visible at a time */
const lookWords=[...document.querySelectorAll('.hj-look-word')];
let lookIndex=0;
function showLookWord(index){
  lookWords.forEach((word,i)=>{
    const active=i===index;
    word.classList.remove('is-active','is-out');
    word.style.display=active?'block':'none';
    if(active) word.classList.add('is-active');
  });
}
function cycleLookWords(){
  if(lookWords.length<2)return;
  lookIndex=(lookIndex+1)%lookWords.length;
  showLookWord(lookIndex);
}
if(lookWords.length){
  showLookWord(0);
  setInterval(cycleLookWords,1650);
}'''

          if old_js not in s:
              raise SystemExit('Could not find platform rotator JavaScript block')
          s = s.replace(old_js, new_js, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'hellojoesolutions'
          git config user.email 'joe@hellojoe.solutions'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'Force platform titles to display one at a time'
          git push
