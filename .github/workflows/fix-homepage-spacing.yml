name: Fix homepage spacing

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-spacing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply screenshot spacing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/production-polish.css')
          t = p.read_text(encoding='utf-8')
          marker = '/* Screenshot spacing fixes — 2026-09-15 */'
          if marker in t:
              print('Spacing fixes already present.')
              raise SystemExit(0)

          block = r'''

/* Screenshot spacing fixes — 2026-09-15 */
/* Keep the animated platform names fully visible, enlarge them 50%,
   and give the opening search animation more breathing room. */
.hj-look-section{
  min-height:310px!important;
  gap:18px!important;
}
.hj-look-viewport{
  max-width:680px!important;
  height:190px!important;
  overflow:hidden!important;
}
.hj-look-word{
  font-size:clamp(87px,9vw,135px)!important;
  line-height:1.06!important;
  letter-spacing:-.075em!important;
  padding:.08em 0 .14em!important;
  box-sizing:border-box!important;
  transform:translateY(150px)!important;
}
.hj-look-word.is-active{
  transform:translateY(-50%)!important;
}
.hj-look-word.is-out{
  transform:translateY(-230px)!important;
}

.opening-searchbar{
  margin-top:30px!important;
}

@media(max-width:900px){
  .hj-look-section{
    min-height:235px!important;
  }
  .hj-look-viewport{
    height:138px!important;
    max-width:100%!important;
  }
  .hj-look-word{
    font-size:clamp(60px,16.05vw,90px)!important;
    line-height:1.06!important;
    letter-spacing:-.075em!important;
    padding:.08em 0 .14em!important;
    transform:translateY(110px)!important;
  }
  .hj-look-word.is-active{
    transform:translateY(-50%)!important;
  }
  .hj-look-word.is-out{
    transform:translateY(-170px)!important;
  }
  .opening-searchbar{
    margin-top:24px!important;
  }
}
'''
          p.write_text(t.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Verify fixes
        run: |
          grep -Fq 'Screenshot spacing fixes — 2026-09-15' assets/production-polish.css
          grep -Fq 'font-size:clamp(87px,9vw,135px)!important' assets/production-polish.css
          grep -Fq 'height:190px!important' assets/production-polish.css
          grep -Fq 'margin-top:30px!important' assets/production-polish.css

      - name: Commit spacing fixes
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'hellojoesolutions'
          git config user.email 'joe@hellojoe.solutions'
          git add assets/production-polish.css
          git commit -m 'Fix homepage animation spacing and platform scale'
          git push
