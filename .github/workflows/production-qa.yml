# Production QA runs after all launch assets are present on main.
name: Production layout QA

on:
  push:
    paths:
      - '*.html'
      - 'assets/**'
      - '.github/workflows/production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static integrity checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          files = sorted(Path('.').glob('*.html'))
          names = {p.name for p in files}
          failures=[]
          rows=[]
          for p in files:
              t=p.read_text(encoding='utf-8')
              local=[]
              for href in re.findall(r'href=["\']([^"\']+)["\']',t,re.I):
                  target=href.split('#',1)[0].split('?',1)[0]
                  if not target or target.startswith(('http://','https://','mailto:','tel:','#')):
                      continue
                  if target.endswith('.html') and Path(target).name not in names:
                      local.append(target)
              row={
                'page':p.name,
                'h1':t.lower().count('<h1'),
                'canonical':bool(re.search(r'<link[^>]+rel=["\']canonical["\']',t,re.I)),
                'description':bool(re.search(r'<meta[^>]+name=["\']description["\']',t,re.I)),
                'polish':'assets/production-polish.css' in t,
                'favicon':'assets/favicon.svg' in t,
                'broken_local_links':sorted(set(local)),
              }
              rows.append(row)
              if row['h1'] != 1: failures.append(f'{p}: H1 count {row["h1"]}')
              if not row['canonical']: failures.append(f'{p}: canonical missing')
              if not row['description']: failures.append(f'{p}: description missing')
              if not row['polish']: failures.append(f'{p}: production polish CSS missing')
              if not row['favicon']: failures.append(f'{p}: favicon missing')
              if row['broken_local_links']: failures.append(f'{p}: broken local links {row["broken_local_links"]}')

          Path('qa-static.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print(f'PASS: {len(files)} HTML pages passed static integrity checks')
          PY

      - name: Validate homepage JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]+type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',t,re.S|re.I)
          Path('/tmp/hellojoe-home.js').write_text('\n'.join(scripts),encoding='utf-8')
          print(f'Extracted {len(scripts)} executable script block(s)')
          PY
          node --check /tmp/hellojoe-home.js

      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/hellojoe-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null

      - name: Browser layout and interaction smoke test
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then echo 'No system Chromium/Chrome binary found.'; exit 1; fi
          export BROWSER_BIN
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright-core');
          const pages=['index.html','pricing.html','resources.html','rgv-marketing.html','mcallen-marketing.html','mission-marketing.html','pharr-marketing.html','social-media-management.html','local-seo.html','google-rgv.html','google-business-profile.html','marketing-where-to-start.html','website-traffic-no-leads.html'];
          const viewports=[{name:'desktop',width:1440,height:1000},{name:'tablet',width:1024,height:900},{name:'mobile',width:390,height:844}];

          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_BIN,args:['--no-sandbox']});
            const results=[]; const failures=[];
            for(const vp of viewports){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'no-preference'});
              for(const file of pages){
                const page=await context.newPage();
                const browserErrors=[];
                page.on('pageerror',e=>browserErrors.push(String(e)));
                page.on('console',m=>{if(m.type()==='error') browserErrors.push(m.text())});
                const response=await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'networkidle'});
                await page.waitForTimeout(file==='index.html'?800:120);
                const metrics=await page.evaluate(()=>{
                  const root=document.documentElement, body=document.body;
                  const interactive=[...document.querySelectorAll('a,button,input,select,textarea')].filter(el=>{
                    const s=getComputedStyle(el), r=el.getBoundingClientRect();
                    return s.display!=='none' && s.visibility!=='hidden' && Number(s.opacity)!==0 && r.width>0 && r.height>0;
                  });
                  const unlabeled=interactive.filter(el=>{
                    if(['INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return false;
                    return !(el.innerText||el.getAttribute('aria-label')||el.getAttribute('title')||'').trim();
                  }).length;
                  return {title:document.title,scrollWidth:Math.max(root.scrollWidth,body.scrollWidth),innerWidth:innerWidth,h1:document.querySelectorAll('h1').length,unlabeled,bodyHeight:Math.max(root.scrollHeight,body.scrollHeight)};
                });
                const overflow=metrics.scrollWidth-metrics.innerWidth;
                if(!(response&&response.ok())) failures.push(`${vp.name} ${file}: HTTP ${response?.status()}`);
                if(overflow>3) failures.push(`${vp.name} ${file}: horizontal overflow ${overflow}px`);
                if(metrics.h1!==1) failures.push(`${vp.name} ${file}: ${metrics.h1} H1s`);
                if(metrics.unlabeled>0) failures.push(`${vp.name} ${file}: ${metrics.unlabeled} unlabeled visible interactive controls`);
                if(browserErrors.length) failures.push(`${vp.name} ${file}: browser errors: ${browserErrors.slice(0,2).join(' | ')}`);

                if(file==='index.html'){
                  if(!(await page.locator('#openingSearch').count())||!(await page.locator('#leadFunnelStage').count())) failures.push(`${vp.name} homepage: locked opener/funnel missing`);
                  const openButton=page.locator('.js-open:visible').first();
                  if(await openButton.count()){
                    await openButton.click();
                    await page.waitForTimeout(120);
                    if(!(await page.locator('#leadModal').isVisible().catch(()=>false))) failures.push(`${vp.name} homepage: intake modal did not open`);
                    const closeButton=page.locator('.js-close:visible').first();
                    if(await closeButton.count()) await closeButton.click();
                  } else failures.push(`${vp.name} homepage: no visible intake trigger`);

                  if(vp.name==='desktop'){
                    const activeBefore=await page.locator('.hj-look-word.is-active').innerText().catch(()=>null);
                    await page.waitForTimeout(1900);
                    const activeAfter=await page.locator('.hj-look-word.is-active').innerText().catch(()=>null);
                    if(activeBefore&&activeAfter&&activeBefore===activeAfter) failures.push('desktop homepage: platform rotator did not advance');
                    const box=await page.locator('#heroScroll').boundingBox();
                    if(box){
                      await page.evaluate(y=>window.scrollTo(0,y),box.y+box.height*.62);
                      await page.waitForTimeout(350);
                      if(!(await page.locator('#leadFunnelStage.exploded').count())) failures.push('desktop homepage: search-to-strategy transition did not activate');
                    }
                  }
                }
                results.push({viewport:vp.name,page:file,...metrics,overflow,browserErrors});
                await page.close();
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('qa-browser.json',JSON.stringify(results,null,2));
            const lines=['# HelloJoe Production QA','',`Run: ${new Date().toISOString()}`,'',`Pages tested: ${pages.length}`,'Viewports: desktop 1440px, tablet 1024px, mobile 390px','',failures.length?'## FAIL':'## PASS',''];
            if(failures.length) lines.push(...failures.map(x=>`- ${x}`));
            else lines.push('- No horizontal overflow detected.','- All tested pages returned successfully with one H1.','- No browser JavaScript errors detected.','- Visible interactive controls had accessible text.','- Homepage lead modal opened and closed.','- Homepage platform rotation advanced.','- Homepage search-to-strategy transition activated on desktop.');
            fs.writeFileSync('PRODUCTION_QA.md',lines.join('\n')+'\n');
            if(failures.length){console.error(failures.join('\n'));process.exit(1)}
            console.log(lines.join('\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-report
          path: |
            PRODUCTION_QA.md
            qa-static.json
            qa-browser.json
